<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Speak-Up Yongin High School</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://unpkg.com/lucide@0.344.0/dist/umd/lucide.min.js"></script>
</head>
<body class="bg-slate-50 text-slate-900">
    <div id="root"></div>

    <script type="text/babel">
        // Lucide 아이콘들을 React 컴포넌트 형태로 쓸 수 있게 전역 객체에서 가져옵니다.
        const { 
            MessageSquare, Award, RefreshCw, ChevronRight, Play, Sparkles, ThumbsUp, 
            AlertTriangle, CheckCircle2, ArrowRight, BookOpen, TrendingUp, User, 
            CornerDownRight, Info, Calendar, School, Clock, Eye, AlertOctagon, 
            HelpCircle, Camera, ShieldAlert, Layers, History, Trash2, Lock, 
            ChevronDown, Menu, X, Check, Star, Settings, FileText, Send, 
            ThumbsDown, MessageCircle, Volume2, Shield, Search, Flame, Target
        } = window.lucide;

        // --- 유저가 작성한 오리지널 React 코드 시작 ---
        const initialMockDebates = [
          {
            id: 'd1',
            title: "교내 스마트폰 사용 전면 허용해야 하는가?",
            category: "학교 생활",
            status: "active",
            participants: 142,
            views: 1204,
            likes: 45,
            creator: "학생회장_박",
            createdAt: "2024-03-01",
            pros: 82,
            cons: 60,
            summary: "수업 시간 외 쉬는 시간과 점심 시간에 스마트폰 사용을 완전히 자율화해야 한다는 의견과 학업 집중도 저하 및 사이버 폭력 노출 위험으로 규제해야 한다는 의견이 대립하고 있습니다.",
            tags: ["스마트폰", "학생인권", "교내규정"],
            opinions: [
              { id: 'o1', type: 'pro', author: '학생A', content: '쉬는 시간까지 통제하는 것은 과도한 자유 침해입니다. 스스로 조절하는 법을 배워야 합니다.', likes: 24, replies: 3, createdAt: '10분 전' },
              { id: 'o2', type: 'con', author: '교사B', content: '쉬는 시간에 허용하더라도 다음 수업 시간에 미치는 영향이 너무 큽니다. 통제가 현실적으로 어렵습니다.', likes: 19, replies: 1, createdAt: '30분 전' }
            ]
          },
          {
            id: 'd2',
            title: "고교학점제 전면 시행에 따른 내신 절대평가 전환",
            category: "교육/입시",
            status: "active",
            participants: 98,
            views: 845,
            likes: 32,
            creator: "진로부장_김",
            createdAt: "2024-03-03",
            pros: 40,
            cons: 58,
            summary: "고교학점제의 취지를 살리기 위해 성적 부풀리기 방지 대책과 함께 전과목 절대평가 도입이 필요하다는 주장과, 대입 변별력 상실 및 대학별 고사 부활 부작용을 우려하는 목소리가 팽팽합니다.",
            tags: ["고교학점제", "절대평가", "대입"],
            opinions: []
          },
          {
            id: 'd3',
            title: "교내 매점 메뉴 다양화 및 무인 자판기 도입",
            category: "학생 복지",
            status: "voting",
            participants: 215,
            views: 1530,
            likes: 88,
            creator: "복지부_이",
            createdAt: "2024-02-25",
            pros: 195,
            cons: 20,
            summary: "학생들의 편의를 위해 매점 운영 시간 외에도 이용할 수 있는 무인 간식 자판기를 추가 설치하자는 안건입니다.",
            tags: ["교내매점", "학생복지", "자판기"],
            opinions: []
          }
        ];

        const initialMockPetitions = [
          {
            id: 'p1',
            title: "급식실 잔반 줄이기 캠페인 및 선호 메뉴 반영 요청",
            content: "안녕하세요, 용인고등학교 학생 여러분. 현재 우리 학교 급식실에서 버려지는 잔반의 양이 매일 엄청납니다. 이는 환경적으로도 문제일 뿐만 아니라 예산 낭비이기도 합니다. 학생들이 선호하지 않는 메뉴가 자주 나오는 것이 주요 원인 중 하나라고 생각합니다. 한 달에 한 번 '학생 제안 메뉴의 날'을 지정하고, 맛있는 급식을 먹는 동시에 잔반을 줄이는 이벤트를 개최할 것을 청원합니다.",
            category: "급식/위생",
            status: "ongoing",
            signatures: 145,
            requiredSignatures: 200,
            creator: "2학년_최OO",
            createdAt: "2024-03-02",
            expiresAt: "2024-04-02",
            answers: null,
            updates: []
          },
          {
            id: 'p2',
            title: "도서관 신간 도서 확충 및 개방 시간 연장 건의",
            content: "방과 후 자습이나 수행평가 준비를 위해 도서관을 이용하려는 학생들이 많으나, 현재 도서관은 방과 후 30분 만에 문을 닫아 이용이 어렵습니다. 또한 최신 과학/인문 분야의 신간 도서가 부족하여 자료 조사에 한계가 있습니다. 개방 시간을 오후 6시까지 연장하고 분기별 학생 희망 도서 구입 예산을 늘려주십시오.",
            category: "시설/환경",
            status: "answered",
            signatures: 210,
            requiredSignatures: 200,
            creator: "독서동아리_정",
            createdAt: "2024-02-15",
            expiresAt: "2024-03-15",
            answers: {
              author: "교무실 (도서관 관리부서)",
              content: "학생들의 독서 열기에 부응하고자 방과 후 개방 시간을 주 3회(월, 수, 금) 오후 5시 30분까지 시범 연장하기로 결정했습니다. 또한 1학기 도서 구입 예산에 학생 희망 도서 비율을 50% 이상 배정하여 신간을 신속히 확충하겠습니다.",
              answeredAt: "2024-03-02"
            },
            updates: [
              { id: 'u1', title: "시범 연장 운영 안내", content: "3월 둘째 주부터 월, 수, 금 연장 운영이 시작됩니다. 많은 이용 바랍니다.", createdAt: "2024-03-04" }
            ]
          }
        ];

        const mockSchools = [
          { id: 's1', name: '용인고등학교', region: '경기 용인', students: 1024, verified: true, points: 1540 },
          { id: 's2', name: '용인백현고등학교', region: '경기 용인', students: 850, verified: true, points: 1210 },
          { id: 's3', name: '수지고등학교', region: '경기 용인', students: 1100, verified: true, points: 1890 },
          { id: 's4', name: '보정고등학교', region: '경기 용인', students: 780, verified: true, points: 950 }
        ];

        const mockNotice = [
          { id: 'n1', title: '제1회 스피크업 교내 청소년 토론대회 개최 안내', date: '2024-03-05', important: true },
          { id: 'n2', title: '서버 점검 및 시스템 고도화 작업 안내 (03/12)', date: '2024-03-04', important: false },
          { id: 'n3', title: '정확한 학교 정보 인증을 위한 학생증 사진 등록 권장', date: '2024-03-01', important: false }
        ];

        function App() {
          const [activeTab, setActiveTab] = React.useState('home');
          const [debates, setDebates] = React.useState(initialMockDebates);
          const [petitions, setPetitions] = React.useState(initialMockPetitions);
          
          const [selectedDebate, setSelectedDebate] = React.useState(null);
          const [selectedPetition, setSelectedPetition] = React.useState(null);
          
          const [newOpinion, setNewOpinion] = React.useState('');
          const [opinionType, setOpinionType] = React.useState('pro');
          
          const [isWritingPetition, setIsWritingPetition] = React.useState(false);
          const [isWritingDebate, setIsWritingDebate] = React.useState(false);
          
          const [petitionForm, setPetitionForm] = React.useState({ title: '', content: '', category: '시설/환경' });
          const [debateForm, setDebateForm] = React.useState({ title: '', summary: '', category: '학교 생활', tags: '' });
          
          const [searchTerm, setSearchTerm] = React.useState('');
          const [userPoints, setUserPoints] = React.useState(350);
          const [signedPetitions, setSignedPetitions] = React.useState([]);
          const [votedDebates, setVotedDebates] = React.useState({});
          const [likedItems, setLikedItems] = React.useState([]);
          
          const [notification, setNotification] = React.useState(null);
          const [showMobileMenu, setShowMobileMenu] = React.useState(false);

          const triggerNotification = (message, type = 'success') => {
            setNotification({ message, type });
            setTimeout(() => setNotification(null), 3000);
          };

          const handleAddOpinion = (debateId) => {
            if (!newOpinion.trim()) return;
            const updated = debates.map(d => {
              if (d.id === debateId) {
                const newOp = {
                  id: 'o_' + Date.now(),
                  type: opinionType,
                  author: '나 (학생인증됨)',
                  content: newOpinion,
                  likes: 0,
                  replies: 0,
                  createdAt: '방금 전'
                };
                const basePros = d.pros;
                const baseCons = d.cons;
                return {
                  ...d,
                  participants: d.participants + 1,
                  pros: opinionType === 'pro' ? basePros + 1 : basePros,
                  cons: opinionType === 'con' ? baseCons + 1 : baseCons,
                  opinions: [newOp, ...d.opinions]
                };
              }
              return d;
            });
            setDebates(updated);
            const currentDebate = updated.find(d => d.id === debateId);
            setSelectedDebate(currentDebate);
            setNewOpinion('');
            setUserPoints(prev => prev + 15);
            triggerNotification('의견이 등록되었습니다! (+15 포인트)');
          };

          const handleVoteDebate = (debateId, type) => {
            if (votedDebates[debateId]) {
              triggerNotification('이미 이 토론의 투표에 참여하셨습니다.', 'error');
              return;
            }
            const updated = debates.map(d => {
              if (d.id === debateId) {
                return {
                  ...d,
                  pros: type === 'pro' ? d.pros + 1 : d.pros,
                  cons: type === 'con' ? d.cons + 1 : d.cons,
                  participants: d.participants + 1
                };
              }
              return d;
            });
            setDebates(updated);
            if (selectedDebate && selectedDebate.id === debateId) {
              setSelectedDebate(updated.find(d => d.id === debateId));
            }
            setVotedDebates({ ...votedDebates, [debateId]: type });
            setUserPoints(prev => prev + 10);
            triggerNotification('찬반 투표가 반영되었습니다! (+10 포인트)');
          };

          const handleSignPetition = (petitionId) => {
            if (signedPetitions.includes(petitionId)) {
              triggerNotification('이미 연명한 청원입니다.', 'error');
              return;
            }
            const updated = petitions.map(p => {
              if (p.id === petitionId) {
                return { ...p, signatures: p.signatures + 1 };
              }
              return p;
            });
            setPetitions(updated);
            if (selectedPetition && selectedPetition.id === petitionId) {
              setSelectedPetition(updated.find(p => p.id === petitionId));
            }
            setSignedPetitions([...signedPetitions, petitionId]);
            setUserPoints(prev => prev + 20);
            triggerNotification('동의 서명이 완료되었습니다! (+20 포인트)');
          };

          const handleLikeItem = (id, type) => {
            const key = type + '_' + id;
            if (likedItems.includes(key)) {
              setLikedItems(likedItems.filter(k => k !== key));
              if (type === 'debate') {
                setDebates(debates.map(d => d.id === id ? { ...d, likes: d.likes - 1 } : d));
                if (selectedDebate && selectedDebate.id === id) {
                  setSelectedDebate({ ...selectedDebate, likes: selectedDebate.likes - 1 });
                }
              }
              return;
            }
            setLikedItems([...likedItems, key]);
            if (type === 'debate') {
              setDebates(debates.map(d => d.id === id ? { ...d, likes: d.likes + 1 } : d));
              if (selectedDebate && selectedDebate.id === id) {
                setSelectedDebate({ ...selectedDebate, likes: selectedDebate.likes + 1 });
              }
              triggerNotification('공감했습니다.');
            }
          };

          const handleCreatePetition = (e) => {
            e.preventDefault();
            if (!petitionForm.title.trim() || !petitionForm.content.trim()) return;
            const newPet = {
              id: 'p_' + Date.now(),
              title: petitionForm.title,
              content: petitionForm.content,
              category: petitionForm.category,
              status: 'ongoing',
              signatures: 1,
              requiredSignatures: 200,
              creator: '나 (2학년)',
              createdAt: new Date().toISOString().split('T')[0],
              expiresAt: new Date(Date.now() + 30 * 24 * 60 * 60 * 1000).toISOString().split('T')[0],
              answers: null,
              updates: []
            };
            setPetitions([newPet, ...petitions]);
            setIsWritingPetition(false);
            setPetitionForm({ title: '', content: '', category: '시설/환경' });
            setUserPoints(prev => prev + 50);
            triggerNotification('새로운 공론화 청원이 시작되었습니다! (+50 포인트)');
          };

          const handleCreateDebate = (e) => {
            e.preventDefault();
            if (!debateForm.title.trim() || !debateForm.summary.trim()) return;
            const tagArr = debateForm.tags.split(',').map(t => t.trim()).filter(Boolean);
            const newDeb = {
              id: 'd_' + Date.now(),
              title: debateForm.title,
              summary: debateForm.summary,
              category: debateForm.category,
              status: 'active',
              participants: 1,
              views: 1,
              likes: 0,
              creator: '나 (2학년)',
              createdAt: new Date().toISOString().split('T')[0],
              pros: 1,
              cons: 0,
              tags: tagArr,
              opinions: []
            };
            setDebates([newDeb, ...debates]);
            setIsWritingDebate(false);
            setDebateForm({ title: '', summary: '', category: '학교 생활', tags: '' });
            setUserPoints(prev => prev + 50);
            triggerNotification('새 토론 의제가 개설되었습니다! (+50 포인트)');
          };

          const filteredDebates = debates.filter(d => 
            d.title.toLowerCase().includes(searchTerm.toLowerCase()) ||
            d.summary.toLowerCase().includes(searchTerm.toLowerCase())
          );

          const filteredPetitions = petitions.filter(p => 
            p.title.toLowerCase().includes(searchTerm.toLowerCase()) ||
            p.content.toLowerCase().includes(searchTerm.toLowerCase())
          );

          return (
            <div class="min-h-screen flex flex-col font-sans">
              {notification && (
                <div class={`fixed top-4 right-4 z-50 p-4 rounded-xl shadow-lg flex items-center gap-2 text-white transform transition-all duration-300 translate-y-0 ${notification.type === 'error' ? 'bg-red-500' : 'bg-emerald-500'}`}>
                  {notification.type === 'error' ? <AlertTriangle size={20} /> : <CheckCircle2 size={20} />}
                  <span class="font-medium text-sm">{notification.message}</span>
                </div>
              )}

              <header class="bg-white border-b border-slate-200 sticky top-0 z-40 shadow-sm">
                <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                  <div class="flex justify-between h-16 items-center">
                    <div class="flex items-center gap-3 cursor-pointer" onClick={() => { setActiveTab('home'); setSelectedDebate(null); setSelectedPetition(null); }}>
                      <div class="bg-indigo-600 p-2.5 rounded-xl text-white shadow-md shadow-indigo-200">
                        <MessageSquare size={22} class="transform -scale-x-100" />
                      </div>
                      <div>
                        <span class="text-xl font-bold tracking-tight bg-gradient-to-r bg-indigo-600 bg-clip-text text-transparent">스피크업</span>
                        <span class="text-xs block text-slate-400 font-semibold tracking-wider">용인고등학교 학생의회</span>
                      </div>
                    </div>

                    <nav class="hidden md:flex space-x-1">
                      {[
                        { id: 'home', label: '홈', icon: School },
                        { id: 'debate', label: '교내 토론광장', icon: MessageCircle },
                        { id: 'petition', label: '공론화 청원', icon: FileText },
                        { id: 'ranking', label: '학교 대항전', icon: Award },
                      ].map((tab) => {
                        const Icon = tab.icon;
                        const isAct = activeTab === tab.id;
                        return (
                          <button
                            key={tab.id}
                            onClick={() => { setActiveTab(tab.id); setSelectedDebate(null); setSelectedPetition(null); }}
                            class={`flex items-center gap-2 px-4 py-2 rounded-xl text-sm font-medium transition-all ${isAct ? 'bg-indigo-50 text-indigo-600' : 'text-slate-600 hover:bg-slate-50 hover:text-slate-900'}`}
                          >
                            <Icon size={18} class={isAct ? 'text-indigo-600' : 'text-slate-400'} />
                            {tab.label}
                          </button>
                        );
                      })}
                    </nav>

                    <div class="hidden md:flex items-center gap-4">
                      <div class="bg-amber-50 border border-amber-200 px-3 py-1.5 rounded-xl flex items-center gap-1.5">
                        <Flame size={16} class="text-amber-500 fill-amber-500 animate-pulse" />
                        <span class="text-xs font-bold text-amber-700">{userPoints} P</span>
                      </div>
                      <div class="flex items-center gap-2 bg-slate-50 border border-slate-200 pl-2 pr-3 py-1 rounded-xl">
                        <div class="w-7 h-7 bg-indigo-100 rounded-lg flex items-center justify-center text-indigo-600 font-bold text-xs">고2</div>
                        <span class="text-xs font-semibold text-slate-700">홍길동 학생</span>
                        <span class="bg-emerald-100 text-emerald-700 text-[10px] font-bold px-1.5 py-0.5 rounded-md">인증됨</span>
                      </div>
                    </div>

                    <div class="md:hidden flex items-center gap-2">
                      <div class="bg-amber-50 border border-amber-200 px-2 py-1 rounded-lg flex items-center gap-1">
                        <Flame size={14} class="text-amber-500 fill-amber-500" />
                        <span class="text-xs font-bold text-amber-700">{userPoints}P</span>
                      </div>
                      <button onClick={() => setShowMobileMenu(!showMobileMenu)} class="p-2 text-slate-600 hover:bg-slate-100 rounded-lg">
                        {showMobileMenu ? <X size={24} /> : <Menu size={24} />}
                      </button>
                    </div>
                  </div>
                </div>

                {showMobileMenu && (
                  <div class="md:hidden bg-white border-t border-slate-100 px-4 pt-2 pb-4 space-y-1 shadow-inner">
                    {[
                      { id: 'home', label: '홈', icon: School },
                      { id: 'debate', label: '교내 토론광장', icon: MessageCircle },
                      { id: 'petition', label: '공론화 청원', icon: FileText },
                      { id: 'ranking', label: '학교 대항전', icon: Award },
                    ].map((tab) => {
                      const Icon = tab.icon;
                      return (
                        <button
                          key={tab.id}
                          onClick={() => { setActiveTab(tab.id); setSelectedDebate(null); setSelectedPetition(null); setShowMobileMenu(false); }}
                          class={`w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-base font-medium ${activeTab === tab.id ? 'bg-indigo-50 text-indigo-600' : 'text-slate-600 hover:bg-slate-50'}`}
                        >
                          <Icon size={20} />
                          {tab.label}
                        </button>
                      );
                    })}
                  </div>
                )}
              </header>

              <main class="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6">
                {activeTab === 'home' && !selectedDebate && !selectedPetition && (
                  <div class="space-y-6">
                    <div class="bg-gradient-to-r from-indigo-600 to-indigo-700 rounded-3xl p-6 sm:p-8 text-white relative overflow-hidden shadow-xl shadow-indigo-100">
                      <div class="absolute -right-10 -bottom-10 opacity-10 text-white transform rotate-12">
                        <MessageSquare size={240} />
                      </div>
                      <div class="relative z-10 max-w-2xl">
                        <span class="inline-flex items-center gap-1.5 bg-indigo-500/30 backdrop-blur-md px-3 py-1 rounded-full text-xs font-semibold mb-3 border border-indigo-400/20">

                        </p>

                            <h2 class="text-lg font-bold flex items-center gap-2 text-slate-800">

                            </h2>
                            <button onClick={() => setActiveTab('debate')} class="text-xs font-semibold text-indigo-600 hover:underline flex items-center">
                              더보기 <ChevronRight size={14} />
                            </button>
                          </div>
                          <div class="divide-y divide-slate-100">
                            {debates.slice(0, 2).map((d) => {
                              const totalVotes = d.pros + d.cons;
                              const proPercent = totalVotes > 0 ? Math.round((d.pros / totalVotes) * 100) : 50;
                              return (
                                <div key={d.id} class="py-4 first:pt-0 last:pb-0 cursor-pointer group" onClick={() => { setSelectedDebate(d); setActiveTab('debate'); }}>

                                    <span class="bg-indigo-50 text-indigo-600 text-[11px] font-bold px-2 py-0.5 rounded-md">{d.category}</span>
                                    <span class="text-slate-400 text-xs">{d.createdAt}</span>
                                  </div>
                                  <h3 class="font-bold text-slate-800 group-hover:text-indigo-600 transition-colors text-base line-clamp-1">{d.title}</h3>

                                  <div class="flex justify-between items-center mt-1.5 text-[11px] font-bold text-slate-500">
                                    <span class="text-emerald-600">찬성 {proPercent}%</span>
                                    <span>{d.participants}명 참여</span>
                                    <span class="text-rose-600">반대 {100 - proPercent}%</span>
                                  </div>
                                </div>

                                    ) : (
                                      <span class="bg-amber-100 text-amber-800 text-[10px] font-extrabold px-2 py-0.5 rounded-full whitespace-nowrap">청원중</span>

                                    <span class="font-bold text-indigo-600">{p.signatures} / {p.requiredSignatures} 명 ({pct}%)</span>
                                  </div>
                                  <div class="mt-2 bg-slate-100 h-1.5 rounded-full overflow-hidden">
                                    <div style={{ width: `${pct}%` }} class="bg-indigo-600 h-full rounded-full"></div>
                                  </div>
                                </div>

                          </div>

                                  <span class={`w-5 h-5 rounded-md flex items-center justify-center text-xs font-black ${i===0?'bg-amber-400 text-slate-950':i===1?'bg-slate-300 text-slate-900':i===2?'bg-amber-600 text-white':'text-slate-400'}`}>{i+1}</span>

                                    </div>
                                    <span class="text-[10px] text-slate-400">{sch.region} · 학생 {sch.students}명</span>
                                  </div>
                                </div>
                                <span class="text-xs font-extrabold text-indigo-300">{sch.points}점</span>
                              </div>

                                  </div>
                                </div>
                                <span class="text-slate-400 font-medium whitespace-nowrap">{n.date}</span>
                              </div>
                            ))}
                          </div>
                        </div>
                      </div>
                    </div>
                  </div>

                          </div>

                              <button onClick={() => setOpinionType('con')} class={`px-3 py-1.5 text-xs font-bold rounded-lg border transition-all ${opinionType === 'con' ? 'bg-rose-500 border-rose-500 text-white' : 'bg-white border-slate-200 text-slate-600'}`}>반대단으로 작성</button>

                              <input

                                class="flex-grow bg-slate-50 border border-slate-200 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-white"
                              />
                              <button onClick={() => handleAddOpinion(selectedDebate.id)} class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-sm px-4 rounded-xl flex items-center gap-1 whitespace-nowrap shadow-md shadow-indigo-100">
                                <Send size={14} /> 등록

                            </div>
                          </div>

                          <div class="space-y-3 mt-4">

                                    <div class="flex items-center gap-1.5">
                                      <span class={`text-[10px] font-black px-1.5 py-0.5 rounded ${op.type === 'pro' ? 'bg-emerald-500 text-white' : 'bg-rose-500 text-white'}`}>{op.type==='pro'?'찬성':'반대'}</span>

                                  </div>
                                  <p class="text-xs sm:text-sm text-slate-600 leading-relaxed font-medium">{op.content}</p>
                                </div>

                          </div>

                        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3">

                              <div class="space-y-1">
                                <label class="font-semibold text-slate-600">의제 제목</label>

                                  <label class="font-semibold text-slate-600">구분 카테고리</label>

                                    <option>학교 생활</option>
                                    <option>교육/입시</option>
                                    <option>학생 복지</option>
                                    <option>교내 규정</option>
                                  </select>

                                <div class="space-y-1">

                                </div>
                              </div>
                              <div class="space-y-1">
                                <label class="font-semibold text-slate-600">안건 요약 및 개설 취지</label>

                              </div>
                            </div>
                            <div class="flex justify-end gap-2 text-xs">
                              <button type="button" onClick={() => setIsWritingDebate(false)} class="bg-slate-100 hover:bg-slate-200 text-slate-600 font-bold px-3 py-2 rounded-lg">취소</button>

                                    <span class="bg-indigo-50 text-indigo-600 text-[10px] font-black px-2 py-0.5 rounded">{d.category}</span>
                                    <span class="text-[10px] text-slate-400">{d.createdAt}</span>
                                  </div>
                                  <h3 class="font-bold text-slate-800 text-base line-clamp-1 group-hover:text-indigo-600">{d.title}</h3>

                                </div>
                                <div class="mt-4">
                                  <div class="bg-slate-100 h-1.5 rounded-full overflow-hidden flex">

                                    <div style={{ width: `${100 - proPercent}%` }} class="bg-rose-500 h-full"></div>
                                  </div>
                                  <div class="flex justify-between items-center mt-1.5 text-[10px] font-bold text-slate-500">
                                    <span class="text-emerald-600">찬성 {proPercent}%</span>
                                    <span>{d.participants}명 참여</span>
                                    <span class="text-rose-600">반대 {100 - proPercent}%</span>
                                  </div>
                                </div>
                              </div>
                            );
                          })}
                        </div>
                      </div>
                    )}
                  </div>
                )}

                {activeTab === 'petition' && (
                  <div>
                    {selectedPetition ? (
                      <div class="bg-white border border-slate-200 rounded-2xl p-5 sm:p-6 shadow-sm max-w-3xl mx-auto space-y-6">
                        <button onClick={() => setSelectedPetition(null)} class="text-xs font-bold text-slate-500 hover:text-slate-800 flex items-center gap-1">

                        </button>
                        
                        <div class="space-y-2">
                          <div class="flex flex-wrap items-center gap-2">
                            <span class="bg-indigo-50 text-indigo-600 text-xs font-bold px-2.5 py-0.5 rounded-md">{selectedPetition.category}</span>

                            ) : (
                              <span class="bg-amber-100 text-amber-800 text-[10px] font-extrabold px-2 py-0.5 rounded-full">청원동의 접수 중</span>

                            </div>
                            <div class="w-full sm:w-60 bg-slate-200 h-2 rounded-full overflow-hidden">
                              <div style={{ width: `${Math.min(100, (selectedPetition.signatures/selectedPetition.requiredSignatures)*100)}%` }} class="bg-indigo-600 h-full rounded-full"></div>
                            </div>
                          </div>
                          <button 
                            onClick={() => handleSignPetition(selectedPetition.id)}
                            disabled={signedPetitions.includes(selectedPetition.id) || selectedPetition.status === 'answered'}
                            class={`w-full sm:w-auto font-bold text-sm px-6 py-2.5 rounded-xl transition-all text-center shadow-sm ${signedPetitions.includes(selectedPetition.id) ? 'bg-slate-200 text-slate-500 cursor-not-allowed' : selectedPetition.status === 'answered' ? 'bg-slate-100 text-slate-400 cursor-not-allowed' : 'bg-indigo-600 hover:bg-indigo-700 text-white shadow-indigo-100'}`}
                          >
                            {signedPetitions.includes(selectedPetition.id) ? '이미 동의하셨습니다' : selectedPetition.status === 'answered' ? '종료된 청원입니다' : '이 청원에 동의하기 (+20P)'}
                          </button>
                        </div>

                        {selectedPetition.answers && (
                          <div class="border-t border-slate-100 pt-5 space-y-3">
                            <h3 class="font-extrabold text-slate-800 text-base flex items-center gap-1.5">
                              <CheckCircle2 size={18} class="text-emerald-500" /> 학교 실무 교무실 공식 답변
                            </h3>
                            <div class="bg-emerald-50/30 border border-emerald-100 p-4 rounded-xl text-xs sm:text-sm text-slate-700 font-medium leading-relaxed">
                              <div class="flex justify-between text-xs font-bold text-emerald-800 mb-1.5">
                                <span>답변 기관: {selectedPetition.answers.author}</span>
                                <span class="text-slate-400 font-normal">{selectedPetition.answers.answeredAt}</span>
                              </div>
                              <p class="whitespace-pre-wrap">{selectedPetition.answers.content}</p>
                            </div>
                          </div>
                        )}
                      </div>
                    ) : (
                      <div class="space-y-4">
                        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3">
                          <div>
                            <h2 class="text-xl font-extrabold text-slate-800">공론화 청원 창구</h2>
                            <p class="text-xs text-slate-400 font-medium mt-0.5">재학생 200명 이상의 동의를 얻은 안건은 학교 자치위원회 및 교무실의 정식 답변을 의무 제출받습니다.</p>
                          </div>
                          <button onClick={() => setIsWritingPetition(!isWritingPetition)} class="bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-bold px-4 py-2.5 rounded-xl flex items-center gap-1 shadow-md">
                            <Plus size={16} /> 학생 정식 청원 제안
                          </button>
                        </div>

                        {isWritingPetition && (
                          <form onSubmit={handleCreatePetition} class="bg-white border border-indigo-100 rounded-2xl p-5 shadow-sm max-w-xl space-y-4">
                            <h3 class="font-bold text-slate-800 text-sm">📝 학생 연명 청원서 서식 작성</h3>
                            <div class="grid grid-cols-1 gap-3 text-xs">
                              <div class="grid grid-cols-2 gap-3">
                                <div class="space-y-1">
                                  <label class="font-semibold text-slate-600">청원 분야</label>
                                  <select value={petitionForm.category} onChange={e=>setPetitionForm({...petitionForm, category:e.target.value})} class="w-full bg-slate-50 border border-slate-200 rounded-lg p-2.5 outline-none bg-white font-medium">
                                    <option>시설/환경</option>
                                    <option>급식/위생</option>
                                    <option>학생 인권</option>
                                    <option>동아리/행사</option>
                                  </select>
                                </div>
                                <div class="space-y-1">
                                  <label class="font-semibold text-slate-600">제안인 자격</label>
                                  <input type="text" disabled value="용인고등학교 재학생 (홍길동)" class="w-full bg-slate-100 border border-slate-200 text-slate-400 rounded-lg p-2.5 font-medium" />
                                </div>
                              </div>
                              <div class="space-y-1">
                                <label class="font-semibold text-slate-600">청원 제목</label>
                                <input type="text" required value={petitionForm.title} onChange={e=>setPetitionForm({...petitionForm, title:e.target.value})} placeholder="학교 규무실의 검토가 필요한 청원 제목을 입력하세요." class="w-full bg-slate-50 border border-slate-200 rounded-lg p-2.5 focus:ring-2 focus:ring-indigo-500 outline-none bg-white font-medium" />
                              </div>
                              <div class="space-y-1">
                                <label class="font-semibold text-slate-600">청원 내용 (상세 내용 및 기대효과)</label>
                                <textarea required rows="4" value={petitionForm.content} onChange={e=>setPetitionForm({...petitionForm, content:e.target.value})} placeholder="현 상황의 문제점, 개선 요구 사항, 변경에 따른 기대효과를 논리적으로 작성해 주시면 서명율이 높아집니다." class="w-full bg-slate-50 border border-slate-200 rounded-lg p-2.5 focus:ring-2 focus:ring-indigo-500 outline-none bg-white font-medium resize-none"></textarea>
                              </div>
                            </div>
                            <div class="flex justify-end gap-2 text-xs">
                              <button type="button" onClick={() => setIsWritingPetition(false)} class="bg-slate-100 hover:bg-slate-200 text-slate-600 font-bold px-3 py-2 rounded-lg">취소</button>
                              <button type="submit" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold px-4 py-2 rounded-lg shadow-sm">청원 등록발의</button>
                            </div>
                          </form>
                        )}

                        <div class="space-y-3">
                          {filteredPetitions.map((p) => {
                            const pct = Math.min(100, Math.round((p.signatures / p.requiredSignatures) * 100));
                            return (
                              <div key={p.id} class="bg-white border border-slate-200 rounded-2xl p-4 shadow-sm hover:shadow-md transition-all cursor-pointer flex flex-col justify-between" onClick={() => setSelectedPetition(p)}>
                                <div class="flex justify-between items-start gap-2 mb-2">
                                  <div>
                                    <div class="flex items-center gap-1.5 mb-1">
                                      <span class="bg-indigo-50 text-indigo-600 text-[10px] font-black px-2 py-0.5 rounded">{p.category}</span>
                                      <span class="text-[10px] text-slate-400">종료일: {p.expiresAt}</span>
                                    </div>
                                    <h3 class="font-bold text-slate-800 text-sm sm:text-base line-clamp-1">{p.title}</h3>
                                  </div>
                                  {p.status === 'answered' ? (
                                    <span class="bg-emerald-100 text-emerald-800 text-[10px] font-black px-2 py-0.5 rounded-full whitespace-nowrap flex items-center gap-0.5"><Check size={12} /> 답변완료</span>
                                  ) : (
                                    <span class="bg-amber-100 text-amber-800 text-[10px] font-black px-2 py-0.5 rounded-full whitespace-nowrap">청원 서명중</span>
                                  )}
                                </div>
                                <div class="mt-2">
                                  <div class="flex justify-between items-center text-xs text-slate-500 font-medium mb-1">
                                    <span>작성: {p.creator}</span>
                                    <span class="font-bold text-indigo-600">{p.signatures} / {p.requiredSignatures}명 ({pct}%)</span>
                                  </div>
                                  <div class="bg-slate-100 h-2 rounded-full overflow-hidden">
                                    <div style={{ width: `${pct}%` }} class="bg-indigo-600 h-full rounded-full"></div>
                                  </div>
                                </div>
                              </div>
                            );
                          })}
                        </div>
                      </div>
                    )}
                  </div>
                )}

                {activeTab === 'ranking' && (
                  <div class="space-y-6 max-w-4xl mx-auto">
                    <div>
                      <h2 class="text-xl font-extrabold text-slate-800">자치 활동 자치구/학교 대항전</h2>
                      <p class="text-xs text-slate-400 font-medium mt-0.5">학생들이 활발하게 의안을 발의하고 성숙한 토론 의견을 많이 남길수록 가산 포인트가 누적되어 학교 순위가 올라갑니다.</p>
                    </div>

                    <div class="bg-white border border-slate-200 rounded-2xl p-5 shadow-sm">
                      <div class="grid grid-cols-3 gap-4 text-center border-b border-slate-100 pb-5 mb-5">
                        <div class="p-3 bg-indigo-50/50 rounded-xl">
                          <span class="text-[11px] block text-slate-400 font-bold mb-0.5">용인고등학교 실시간 점수</span>
                          <span class="text-xl font-black text-indigo-600">1,540 점</span>
                        </div>
                        <div class="p-3 bg-emerald-50/50 rounded-xl">
                          <span class="text-[11px] block text-slate-400 font-bold mb-0.5">전체 참여율 순위</span>
                          <span class="text-xl font-black text-emerald-600">시내 2 위</span>
                        </div>
                        <div class="p-3 bg-amber-50/50 rounded-xl">
                          <span class="text-[11px] block text-slate-400 font-bold mb-0.5">이달의 획득 보상</span>
                          <span class="text-xl font-black text-amber-600">도서관 예산 인센티브</span>
                        </div>
                      </div>

                      <h3 class="font-bold text-slate-800 text-sm mb-3">🏆 전체 고등학교 랭킹 보드</h3>
                      <div class="space-y-2">
                        {mockSchools.map((sch, i) => (
                          <div key={sch.id} class={`flex items-center justify-between p-4 rounded-xl border ${sch.id === 's1' ? 'bg-indigo-50/20 border-indigo-200' : 'bg-white border-slate-100'}`}>
                            <div class="flex items-center gap-3">
                              <span class={`w-6 h-6 rounded-lg flex items-center justify-center text-xs font-black ${i===0?'bg-amber-400 text-slate-900':i===1?'bg-slate-200 text-slate-800':i===2?'bg-amber-600 text-white':'bg-slate-100 text-slate-500'}`}>{i+1}</span>
                              <div>
                                <h4 class="font-bold text-sm text-slate-800 flex items-center gap-1">
                                  {sch.name}
                                  {sch.id === 's1' && <span class="bg-indigo-600 text-white text-[9px] font-black px-1.5 py-0.2 rounded">우리학교</span>}
                                </h4>
                                <span class="text-[11px] text-slate-400 font-medium">{sch.region} · 총 {sch.students}명의 인증 학생</span>
                              </div>
                            </div>
                            <span class="text-sm font-black text-slate-700">{sch.points} P</span>
                          </div>
                        ))}
                      </div>
                    </div>
                  </div>
                )}
              </main>

              <footer class="bg-white border-t border-slate-200 py-6 mt-12 text-center text-xs text-slate-400 font-medium">
                <p>© 2026 스피크업 학생의회 자치회 시스템. All Rights Reserved.</p>
              </footer>
            </div>
          );
        }

        // 아이콘을 생성하기 위해 추가한 더미 컴포넌트입니다.
        function Plus({ size, ...props }) {
            return (
                <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" {...props}>
                    <path d="M5 12h14"></path>
                    <path d="M12 5v14"></path>
                </svg>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
